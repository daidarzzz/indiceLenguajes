<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <style>
        body {
            padding: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        button {
            padding: 10px 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #texto {
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="cambiarFondo">Cambiar fondo</button>

    <p id="texto" style="display:none">Texto oculto</p>
    <button id="toggle">Mostrar/Ocultar</button>

    <script>
        document.getElementById("cambiarFondo").addEventListener("click", () => {
            document.body.style.backgroundColor = "lightblue";
        });

        document.getElementById("toggle").addEventListener("click", () => {
            let texto = document.getElementById("texto");
            texto.style.display = texto.style.display === "none" ? "block" : "none";
        });
    </script>

</body>
</html>
